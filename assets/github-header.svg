  <text x="66" y="382" fill="#93A4BA" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="1.2">PYTHON  /  DJANGO  /  REACT  /  TYPESCRIPT</text>
  <g transform="translate(868 100)">
