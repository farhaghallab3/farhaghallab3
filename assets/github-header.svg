<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Farha Ghallab — Full-Stack Developer</title>
  <desc id="desc">Minimal dark editorial header with technical architecture motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B111B"/>
      <stop offset="1" stop-color="#111C2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DE0CC"/>
      <stop offset="1" stop-color="#8BAFFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#243347" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
